<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Docente • UNDB Arquitetura</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; background-color: var(--bg-secondary);">

  <!-- Cabeçalho Mínimo -->
  <header style="padding: 2rem 0; border-bottom: 1px solid var(--border-light); background: #FFF;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="brand-identity">
        <span class="brand-identity__logo">ARQUITETURA UNDB</span>
      </a>
      <a href="index.html" class="btn btn-outline" style="font-size: 0.75rem; padding: 0.4rem 0.8rem;">
        ← Retornar ao Portfólio
      </a>
    </div>
  </header>

  <!-- Card de Autenticação -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div style="width: 100%; max-width: 440px; background: #FFFFFF; padding: 3rem; border: 1px solid var(--border-light); box-shadow: 0 10px 30px rgba(0,0,0,0.03); border-radius: 2px;">
      
      <div style="margin-bottom: 2.25rem;">
        <span class="tag-code" style="color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Área Restrita</span>
        <h1 style="font-size: 1.75rem; font-weight: 600;">Autenticação</h1>
        <p style="font-size: 0.88rem; color: var(--text-secondary); margin-top: 0.4rem;">
          Acesso exclusivo para coordenação e professores orientadores do curso de Arquitetura UNDB.
        </p>
      </div>

      <form id="login-form" onsubmit="event.preventDefault(); window.location.href='admin.html';">
        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem;">E-mail Institucional</label>
          <input type="email" required value="admin@undb.edu.br" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-medium); border-radius: 2px; font-family: inherit; font-size: 0.9rem;" />
        </div>

        <div style="margin-bottom: 1.75rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <label style="font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase;">Senha</label>
            <a href="#" onclick="alert('Contate o NTI da UNDB para recuperação de senha institucional.')" style="font-size: 0.75rem; color: var(--text-muted);">Esqueceu?</a>
          </div>
          <input type="password" required value="undb2026" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-medium); border-radius: 2px; font-family: inherit; font-size: 0.9rem;" />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem;">
          Entrar no Painel Curatorial
        </button>
      </form>

      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light); font-size: 0.78rem; color: var(--text-muted); text-align: center;">
        Acesso protegido por autenticação de dois fatores da UNDB.
      </div>
    </div>
  </main>

  <footer style="padding: 1.5rem 0; text-align: center; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border-light); background: #FFF;">
    © 2026 UNDB Arquitetura & Urbanismo • Ambiente Administrativo
  </footer>

</body>
</html>
